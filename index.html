<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>这句话，靠什么骗人？</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-2:#2C4A7C;
    --gold:#C9A227;
    --gold-2:#E0B93F;
    --paper:#F7F5F0;
    --ink:#1E2430;
    --ink-2:#5A6270;
    --line:#E3DED3;
    --ok:#2E7D5B;
    --bad:#B4453A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;margin:0 auto;min-height:100%;
    position:relative;display:flex;flex-direction:column;
    background:var(--paper);
    box-shadow:0 0 40px rgba(0,0,0,.06);
  }

  /* 顶部进度 */
  #bar{
    position:fixed;top:0;left:0;right:0;height:3px;z-index:50;
    background:transparent;pointer-events:none;
    max-width:480px;margin:0 auto;
  }
  #bar-fill{
    height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .35s ease;
  }

  .screen{
    display:none;flex-direction:column;
    padding:calc(28px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));
    flex:1;min-height:100vh;
  }
  .screen.active{display:flex;animation:fade .38s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ============ 封面 ============ */
  .cover-top{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:10px;}
  .kicker{
    display:inline-block;font-size:12px;letter-spacing:.22em;color:var(--gold);
    font-weight:700;margin-bottom:20px;
  }
  h1{
    font-size:34px;line-height:1.28;margin:0 0 18px;font-weight:800;letter-spacing:-.5px;
    color:var(--navy);
  }
  h1 em{font-style:normal;position:relative;white-space:nowrap;}
  h1 em::after{
    content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:10px;
    background:linear-gradient(90deg,rgba(201,162,39,.42),rgba(201,162,39,.12));
    z-index:-1;border-radius:2px;
  }
  .sub{font-size:15px;color:var(--ink-2);margin:0 0 26px;line-height:1.75;}
  .rule{
    border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 30px;
    font-size:13.5px;color:var(--ink-2);line-height:1.85;
  }
  .rule b{color:var(--navy);}

  /* 按钮 */
  .btn{
    display:flex;align-items:center;justify-content:center;
    width:100%;padding:16px 18px;border:none;border-radius:14px;
    font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;
    background:var(--navy);color:#fff;
    transition:transform .12s ease,background .2s ease,box-shadow .2s;
    box-shadow:0 6px 18px rgba(31,56,100,.22);
  }
  .btn:active{transform:scale(.975);background:var(--navy-2);}
  .btn.ghost{
    background:transparent;color:var(--navy);border:1.5px solid var(--line);
    box-shadow:none;font-weight:600;
  }
  .btn.ghost:active{background:rgba(31,56,100,.05);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#3A2E05;box-shadow:0 6px 18px rgba(201,162,39,.3);}

  /* ============ 答题 ============ */
  .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .q-count{font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:.05em;}
  .q-count b{color:var(--gold);font-size:20px;font-weight:800;}
  .q-hint{font-size:12.5px;color:#9A9385;}
  .q-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh;}
  .q-quote{
    background:#fff;border-radius:18px;padding:26px 22px;margin:14px 0 8px;
    box-shadow:0 3px 16px rgba(30,36,48,.07);
    position:relative;
  }
  .q-quote::before{
    content:"“";position:absolute;top:-6px;left:14px;
    font-size:64px;line-height:1;color:rgba(201,162,39,.28);font-family:Georgia,serif;
  }
  .q-quote p{
    margin:0;font-size:21px;line-height:1.62;font-weight:600;color:var(--ink);
    letter-spacing:-.2px;
  }
  .q-ask{font-size:13.5px;color:var(--ink-2);margin:14px 0 10px;font-weight:600;}
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .opt{
    display:flex;align-items:center;gap:13px;
    width:100%;padding:18px 17px;border-radius:13px;
    background:#fff;border:1.5px solid var(--line);
    font-size:17px;font-weight:600;font-family:inherit;color:var(--ink);
    cursor:pointer;text-align:left;
    transition:all .16s ease;
  }
  .opt .dot{
    flex:0 0 24px;height:24px;border-radius:50%;
    border:1.5px solid #CFC9BB;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#A9A290;
    transition:all .16s ease;
  }
  .opt:active{transform:scale(.985);}
  .opt.on{border-color:var(--navy);background:#F2F5FB;}
  .opt.on .dot{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* 上一题 */
  .q-nav{display:flex;align-items:center;justify-content:flex-start;min-height:34px;margin-top:4px;}
  .prev-btn{
    display:inline-flex;align-items:center;gap:5px;
    background:transparent;border:none;padding:8px 4px;border-radius:8px;
    font-size:14px;font-weight:600;font-family:inherit;color:#8A8578;
    cursor:pointer;transition:color .16s ease;
  }
  .prev-btn::before{content:"←";font-size:15px;line-height:1;}
  .prev-btn:active{color:var(--navy);}
  .prev-btn[hidden]{display:none;}

  /* ============ 结果 ============ */
  .res-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:6px;}
  .res-img{
    width:100%;max-width:300px;margin:0 auto 22px;border-radius:20px;
    display:block;box-shadow:0 14px 40px rgba(30,36,48,.16);
    animation:pop .5s cubic-bezier(.2,1.1,.3,1) both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
  .res-label{font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:700;margin-bottom:10px;}
  .res-title{
    font-size:38px;font-weight:800;color:var(--navy);margin:0 0 14px;letter-spacing:-1px;
    line-height:1.2;
  }
  .res-text{
    font-size:17px;color:var(--ink-2);margin:0 auto 22px;max-width:320px;line-height:1.7;
    font-weight:500;
  }
  .res-score{
    display:inline-flex;align-items:baseline;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:8px 18px;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:26px;
  }
  .res-score b{font-size:22px;color:var(--navy);font-weight:800;}
  .res-actions{display:flex;flex-direction:column;gap:10px;}

  /* ============ 询问页 ============ */
  .ask-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;}
  .ask-img{
    width:100%;max-width:280px;margin:0 auto 26px;border-radius:20px;display:block;
    box-shadow:0 14px 40px rgba(30,36,48,.16);
    animation:pop .5s cubic-bezier(.2,1.1,.3,1) both;
  }
  .ask-q{font-size:25px;font-weight:800;color:var(--navy);margin:0 0 10px;line-height:1.35;letter-spacing:-.4px;}
  .ask-note{font-size:14px;color:var(--ink-2);margin:0 0 26px;}
  .ask-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;width:100%;}

  /* ============ 答案页 ============ */
  .ans-head{padding-bottom:8px;}
  .ans-title{font-size:26px;font-weight:800;color:var(--navy);margin:0 0 6px;letter-spacing:-.4px;}
  .ans-sub{font-size:13.5px;color:var(--ink-2);margin:0 0 4px;}
  .ans-list{flex:1;padding-top:10px;}
  .ans-item{
    background:#fff;border-radius:14px;padding:16px 16px 15px;margin-bottom:11px;
    box-shadow:0 2px 10px rgba(30,36,48,.05);
  }
  .ans-item .no{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:7px;background:#F0EDE5;
    font-size:12px;font-weight:800;color:var(--ink-2);margin-right:8px;vertical-align:1px;
  }
  .ans-item .q{font-size:15.5px;font-weight:700;line-height:1.6;margin:0 0 10px;}
  .ans-line{font-size:13.5px;line-height:1.75;margin:0 0 6px;display:flex;gap:8px;}
  .ans-line .tag{
    flex:0 0 auto;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;height:20px;line-height:16px;
  }
  .tag.right{background:#E7F3EC;color:var(--ok);}
  .tag.wrong{background:#FBEBE9;color:var(--bad);}
  .tag.why{background:#F5F0E0;color:#8A6D12;}
  .ans-line .txt{flex:1;color:var(--ink);}
  .ans-line .txt.why{color:var(--ink-2);font-size:13px;line-height:1.8;}
  .ans-foot{padding:14px 0 6px;display:flex;flex-direction:column;gap:10px;}

  .footer-note{
    text-align:center;font-size:11.5px;color:#A9A290;margin-top:18px;line-height:1.8;
  }

  /* 小屏适配 */
  @media (max-height:680px){
    h1{font-size:29px;}
    .res-img{max-width:230px;margin-bottom:16px;}
    .res-title{font-size:31px;}
    .ask-img{max-width:210px;}
    .q-quote p{font-size:19px;}
  }
</style>
</head>

<div id="app">
  <div id="bar"><div id="bar-fill"></div></div>

  <!-- ========== 封面 ========== -->
  <section class="screen active" id="s-cover">
    <div class="cover-top">
      <span class="kicker">心晴社 · 应读书会</span>
      <h1>这句话，<br>靠什么<em>骗人</em>？</h1>
      <p class="sub">十条你大概都刷到过的话。<br>每一句都在偷偷用一招——你能认出几招？</p>
      <div class="rule">
        <b>十道题</b>，每题三个选项，选一个就行。<br>
        答完才给分，中途不提示对错。<br>
        分数不重要，认得出手法才算数。
      </div>
    </div>
    <button class="btn" id="btn-start">开始（约 1 分钟）</button>
    <p class="footer-note">题目为模拟示例，不指向任何真实事件</p>
  </section>

  <!-- ========== 答题 ========== -->
  <section class="screen" id="s-quiz">

      <span class="q-count"><b id="cur">1</b> / 10</span>

    <div class="q-body">
      <div class="q-quote"><p id="q-text"></p></div>
      <p class="q-ask">选一个最像的：</p>

    </div>
    <div class="q-nav">
      <button class="prev-btn" id="btn-prev" hidden>上一题</button>
    </div>
  </section>

  <!-- ========== 结果 ========== -->
  <section class="screen" id="s-result">

      <img class="res-img" id="r-img" alt="">
      <div class="res-label">你的称号</div>
      <h2 class="res-title" id="r-title"></h2>
      <p class="res-text" id="r-text"></p>
      <div class="res-score">识破 <b id="r-score">0</b> / 10 句</div>
      <div class="res-actions">
        <button class="btn gold" id="btn-answer">看答案解析</button>

};

/* ================= 状态 ================= */
let idx = 0;
let picks = new Array(QUIZ.length).fill(-1);
let score = 0;
let autoNext = null;

const $ = (id) => document.getElementById(id);
const screens = ["s-cover", "s-quiz", "s-result", "s-ask", "s-answer"];

function show(id, progress) {
  screens.forEach(s => $(s).classList.toggle("active", s === id));
  $("bar-fill").style.width = (progress == null ? 0 : progress) + "%";
  window.scrollTo(0, 0);
}

/* ================= 答题 ================= */
function renderQ() {
  const item = QUIZ[idx];
  $("cur").textContent = idx + 1;
  $("q-text").textContent = item.q;
  const box = $("opts");
  box.innerHTML = "";
  item.opts.forEach((label, i) => {
    const b = document.createElement("button");
    b.className = "opt" + (picks[idx] === i ? " on" : "");
    b.innerHTML = '<span class="dot">' + "ABC"[i] + '</span><span>' + label + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });
  $("bar-fill").style.width = (idx / QUIZ.length * 100) + "%";
  $("btn-prev").hidden = idx === 0;
}

function choose(i) {
  picks[idx] = i;
  const item = QUIZ[idx];
  if (i === item.a) score++;
  document.querySelectorAll(".opt").forEach((el, k) => el.classList.toggle("on", k === i));
  clearTimeout(autoNext);
  autoNext = setTimeout(() => {
    if (idx < QUIZ.length - 1) {
      idx++;
      renderQ();
    } else {
      finish();
    }
  }, 320);
}

function prevQ() {
  if (idx === 0) return;
  clearTimeout(autoNext);
  idx--;
  renderQ();
}

/* ================= 结果 ================= */
function finish() {
  const correct = picks.reduce((n, p, i) => n + (p === QUIZ[i].a ? 1 : 0), 0);
  score = correct;
  $("bar-fill").style.width = "100%";

  if (score < 2) {                // 0–1 题（0–19 分）：走询问页
    show("s-ask", 100);
    return;
  }
  const tier = TIERS.find(t => score * 10 >= t.min);
  renderResult(tier.title, tier.img, tier.text);
}

function renderResult(title, img, text) {
  $("r-title").textContent = title;
  $("r-img").src = img;
  $("r-img").alt = title;
  $("r-text").textContent = text;
  $("r-score").textContent = score;
  show("s-result", 100);
}

/* ================= 答案 ================= */
function renderAnswer() {
  const list = $("ans-list");
  list.innerHTML = "";
  QUIZ.forEach((item, i) => {
    const mine = picks[i];
    const right = mine === item.a;
    const div = document.createElement("div");
    div.className = "ans-item";
    div.innerHTML =
      '<p class="q"><span class="no">' + (i + 1) + '</span>' + item.q + '</p>' +
      '<div class="ans-line"><span class="tag right">正解</span><span class="txt">' + item.opts[item.a] + '</span></div>' +
      (right
        ? '<div class="ans-line"><span class="tag right">你选</span><span class="txt">' + item.opts[mine] + '（对）</span></div>'
        : '<div class="ans-line"><span class="tag wrong">你选</span><span class="txt">' + (mine >= 0 ? item.opts[mine] : '未作答') + '</span></div>') +
      '<div class="ans-line"><span class="tag why">为什么</span><span class="txt why">' + item.why + '</span></div>';
    list.appendChild(div);
  });
  show("s-answer", 100);
}

/* ================= 重置 ================= */
function reset() {
  idx = 0;
  picks = new Array(QUIZ.length).fill(-1);
  score = 0;
  show("s-cover", 0);
}

/* ================= 事件 ================= */
$("btn-start").addEventListener("click", () => { idx = 0; score = 0; picks = new Array(QUIZ.length).fill(-1); show("s-quiz", 0); renderQ(); });
$("btn-prev").addEventListener("click", prevQ);
$("btn-yes").addEventListener("click", () => renderResult(SPECIAL.yes.title, SPECIAL.yes.img, SPECIAL.yes.text));
$("btn-no").addEventListener("click", () => renderResult(SPECIAL.no.title, SPECIAL.no.img, SPECIAL.no.text));
$("btn-answer").addEventListener("click", renderAnswer);
$("btn-again").addEventListener("click", reset);
$("btn-again2").addEventListener("click", reset);
$("btn-back").addEventListener("click", () => {
  if (score * 10 >= 20) {
    const tier = TIERS.find(t => score * 10 >= t.min);
    renderResult(tier.title, tier.img, tier.text);
  } else {
    show("s-ask", 100);
  }
});
</script>
